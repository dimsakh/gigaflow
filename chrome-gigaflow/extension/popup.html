<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GigaFlow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="mark">G</span>
    <div><strong>GigaFlow</strong><small id="connection">Проверяю помощник…</small></div>
  </header>
  <button id="toggle">Начать диктовку</button>
  <label for="filter">Очистка слов-паразитов</label>
  <select id="filter">
    <option value="off">Выключена</option>
    <option value="soft">Мягкая</option>
    <option value="full">Полная</option>
  </select>
  <p>Горячая клавиша: <b>Alt+Shift+Space</b></p>
  <script src="popup.js"></script>
</body>
</html>
