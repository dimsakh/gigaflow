[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigaflow-chrome"
version = "0.1.0"
description = "Local GigaAM voice input companion for Chrome"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.0,<3",
    "onnx-asr[cpu,hub]>=0.12,<0.13",
    "sounddevice>=0.5,<0.6",
]

[project.scripts]
gigaflow-chrome = "gigaflow_chrome.host:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
